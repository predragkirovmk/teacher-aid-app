<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
body{display:flex;flex-direction:column;justify-content:center;gap:70px;padding:0 200px}
.strip{display:flex;gap:6px;height:130px}
.seg{border-radius:4px;background:#CFCFCF}
#b .seg{background:#111}
</style></head><body>
<div class="strip" id="b"></div>
<script>
function fill(id,len){const el=document.getElementById(id);let t=2700;while(t>0){const d=document.createElement('div');d.className='seg';d.style.flex=Math.min(len,t)+' 1 0';el.appendChild(d);t-=len}}
fill('b',47);
</script></body></html>
