<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.rows{margin-top:120px;display:grid;grid-template-columns:150px 1fr 260px;row-gap:70px;align-items:center;font-size:34px}
.lab{color:#777}.val{text-align:right;color:#777}
.strip{display:flex;gap:8px;height:110px}
.seg{border-radius:6px;background:#CFCFCF}
#b .seg{background:#111}
.axis{grid-column:2;display:flex;justify-content:space-between;font-size:24px;color:#999;margin-top:-40px}
</style></head><body>
<h1>The same 10 minutes, cut into pieces</h1>
<div class="sub">Each block is one stretch of focus before we switch</div>
<div class="rows">
 <span class="lab">2004</span><div class="strip" id="a"></div><span class="val">4 blocks</span>
 <span class="lab" style="color:#111;font-weight:500">Today</span><div class="strip" id="b"></div><span class="val" style="color:#111;font-weight:500">13 blocks</span>
 <div class="axis"><span>0 min</span><span>5 min</span><span>10 min</span></div>
</div>
<div class="src">Source: Gloria Mark, Attention Span (2023). 2 min 30 s per block in 2004, 47 s today.</div>
<script>
function fill(id,len){const el=document.getElementById(id);let t=600;while(t>0){const d=document.createElement('div');d.className='seg';d.style.flex=Math.min(len,t)+' 1 0';el.appendChild(d);t-=len}}
fill('a',150);fill('b',47);
</script></body></html>
