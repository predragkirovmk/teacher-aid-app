<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.rows{margin-top:110px;display:grid;grid-template-columns:150px 1fr 220px;row-gap:56px;align-items:center;font-size:34px}
.lab{color:#777}.val{text-align:right;color:#777}
.bar{height:72px;background:#DDD;border-radius:6px}
.now .lab,.now .val{color:#111;font-weight:500}.now .bar{background:#111}
</style></head><body>
<h1>Our focus is shrinking</h1>
<div class="sub">Average time on one screen before switching</div>
<div class="rows">
 <span class="lab">2004</span><div><div class="bar" style="width:100%"></div></div><span class="val">2 min 30 s</span>
 <span class="lab">2012</span><div><div class="bar" style="width:50%"></div></div><span class="val">75 s</span>
 <span class="lab now" style="color:#111;font-weight:500">Today</span><div><div class="bar" style="width:31.3%;background:#111"></div></div><span class="val" style="font-weight:500;color:#111">47 s</span>
</div>
<div class="src">Source: Gloria Mark, Attention Span (2023)</div>
</body></html>
