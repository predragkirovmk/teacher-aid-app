name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # LayoutProps and PageProps are global types that Next writes into .next/types; a fresh checkout has none until
      # they are generated, so tsc would fail on every layout and page.
      - name: Typecheck
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # The end-to-end tests build the app again with NEXT_PUBLIC_E2E=1 (see playwright.config.ts) and run Chromium over http.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
