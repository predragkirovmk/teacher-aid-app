<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef2f2">
<title>TeacherAid</title>
<link rel="icon" href="/teacher-icons/icon.svg" type="image/svg+xml">
<style>
  /* The look of the teacher app (app/(teacher)/teacher.css), by hand: this page is shown when nothing else can be loaded. */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #eef2f2; color: #0d2a32; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: 100%; max-width: 480px; padding: 32px; border-radius: 20px; background: #fff; box-shadow: 0 0 0 1px rgba(13, 42, 50, 0.06); }
  img { display: block; width: 48px; height: 48px; margin-bottom: 24px; border-radius: 12px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 650; line-height: 1.15; letter-spacing: -0.02em; }
  p { margin: 0 0 24px; color: #4a6068; }
  button { min-height: 48px; padding: 0 24px; border: 1px solid transparent; border-radius: 24px; background: #124554; color: #fff; font: 600 17px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; cursor: pointer; }
  button:focus-visible { outline: 3px solid #124554; outline-offset: 2px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <img src="/teacher-icons/icon-192.png" alt="" width="56" height="56">
  <div data-lang="mk">
    <h1>Нема интернет</h1>
    <p>Нема интернет. Часот и лекциите бараат интернет; обидете се повторно кога ќе се поврзете.</p>
    <button type="button">Обиди се повторно</button>
  </div>
  <div data-lang="en" hidden>
    <h1>No internet</h1>
    <p>No internet. Lessons and lesson time need the internet; try again when you are connected.</p>
    <button type="button">Try again</button>
  </div>
</main>
<script>
  (function () {
    var locale = "mk";
    try { locale = JSON.parse(localStorage.getItem("teacheraid-teacher-v1") || "{}").locale === "en" ? "en" : "mk"; } catch (e) {}
    document.documentElement.lang = locale;
    var blocks = document.querySelectorAll("[data-lang]");
    for (var i = 0; i < blocks.length; i++) blocks[i].hidden = blocks[i].getAttribute("data-lang") !== locale;
    var buttons = document.querySelectorAll("button");
    for (var j = 0; j < buttons.length; j++) buttons[j].addEventListener("click", function () { location.href = "/teacher"; });
    var visible = document.querySelector("[data-lang]:not([hidden]) button");
    if (visible) visible.focus();
  })();
</script>
</body>
</html>
